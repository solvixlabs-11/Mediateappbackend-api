services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mediate-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrongPassword123!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrongPassword123! -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mediate-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - DATABASE_URL=mssql+pyodbc://sa:YourStrongPassword123!@sqlserver:1433/mediate_db?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
      - SECRET_KEY=development-secret-key-change-in-production-must-be-32-chars-min
      - STORAGE_PROVIDER=local
      - LOCAL_STORAGE_PATH=/app/storage
    volumes:
      - ./app:/app/app
      - ./storage:/app/storage
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sqlserver-data:
